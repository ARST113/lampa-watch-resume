name: ARX Player Tools checks
on:
  push:
    paths:
      - 'arx_player_tools.js'
      - 'tests/arx_player_tools.test.js'
      - '.github/workflows/arx-player-tools.yml'
  pull_request:
    paths:
      - 'arx_player_tools.js'
      - 'tests/arx_player_tools.test.js'
      - '.github/workflows/arx-player-tools.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check arx_player_tools.js
      - name: Unit tests
        run: node --test tests/arx_player_tools.test.js
